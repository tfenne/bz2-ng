name: CI

# Runs when started by hand and when the library changes on main, not on every
# push: minutes on a private repository are billed, so branches are tested
# locally and CI is started deliberately at milestones (Actions tab, or
# `gh workflow run ci.yml --ref <branch>`). Started by hand it can run one
# group of jobs alone (`-f jobs=windows`), which is how a fix to one job is
# checked without paying for the others.
#
# CI adds what local runs lack: a machine with nothing installed, other CPUs,
# and the sanitisers on Linux. It does not repeat the whole suite, which the
# reference machines run in full (docs/spec.md section 6). Left out here: the
# mutation tests, which are two fifths of the suite's time, and under the
# sanitisers also the capacity tests and every tier but the vector one.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: The group of jobs to run
        type: choice
        default: all
        options: [all, build-and-test, portability, windows, msvc, fuzz]
  push:
    branches: [main]
    paths:
      - "c/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'build-and-test'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux runners only: x86-64 exercises the scalar, SSE4 and AVX2
        # tiers, arm64 the scalar and NEON tiers. The tests iterate over
        # every tier the runner's CPU supports. Every build tests both
        # decoder layouts, so the in-formula job runs only the tests that
        # depend on which one is the library's default; it also takes
        # Fedora's SONAME, so that its install layout is tested too.
        include:
          - name: x86-64 / gcc
            os: ubuntu-24.04
            cc: gcc
            ctest_args: "-E mutate"
          - name: x86-64 / clang
            os: ubuntu-24.04
            cc: clang
            ctest_args: "-E mutate"
          - name: arm64 / gcc
            os: ubuntu-24.04-arm
            cc: gcc
            ctest_args: "-E mutate"
          - name: arm64 / clang
            os: ubuntu-24.04-arm
            cc: clang
            ctest_args: "-E mutate"
          - name: x86-64 / clang / sanitisers
            os: ubuntu-24.04
            cc: clang
            cmake_args: "-DBZ2NG_SANITIZE=ON"
            ctest_args: "-E 'mutate|capacity|_(scalar|sse4)$'"
          - name: arm64 / clang / sanitisers
            os: ubuntu-24.04-arm
            cc: clang
            cmake_args: "-DBZ2NG_SANITIZE=ON"
            ctest_args: "-E 'mutate|capacity|_scalar$'"
          - name: x86-64 / gcc / in-formula decoder
            os: ubuntu-24.04
            cc: gcc
            cmake_args: "-DBZ2NG_DECODER_IN_FORMULA=ON -DBZ2NG_SONAME=1"
            ctest_args: "-R 'memtest|tier_identity|abi_|bzip2_|install_layout'"
          - name: x86-64 / gcc / BZ_NO_STDIO
            os: ubuntu-24.04
            cc: gcc
            cmake_args: "-DBZ2NG_NO_STDIO=ON"
    steps:
      # The tests generate their own data, so the LFS corpora are not fetched.
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build c/build -j "$(nproc)"
      # The sanitised tests are slow on a shared runner; CTest's default of
      # 1500 s per test is too close to the longest of them.
      - name: Test
        run: ctest --test-dir c/build -j "$(nproc)" --output-on-failure --timeout 2400 ${{ matrix.ctest_args }}

  # Big-endian and 32-bit targets, which have only the scalar tier, built on
  # the x86-64 runner: s390x with Ubuntu's cross compiler, its test programs
  # under QEMU user emulation; i686 with -m32, run natively. No other job can
  # see a byte-order mistake: on a little-endian target every byte swap
  # compiles away. The big-endian job leaves out the tests that take more
  # than five minutes under emulation, and its per-test limit is short
  # because a byte-order mistake can make the encoder loop without end.
  portability:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'portability'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: s390x (big-endian, emulated) / gcc
            packages: gcc-s390x-linux-gnu libc6-dev-s390x-cross binutils-multiarch qemu-user-binfmt
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x
              -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc
            qemu_ld_prefix: /usr/s390x-linux-gnu
            ctest_args: "--timeout 600 -E 'mutate|valid|crafted|capacity|cli_compare'"
          - name: i686 (32-bit) / gcc
            packages: gcc-multilib
            cmake_args: -DCMAKE_C_FLAGS=-m32
            ctest_args: "--timeout 2400 -E mutate"
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Configure
        run: cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build c/build -j "$(nproc)"
      - name: Test
        env:
          QEMU_LD_PREFIX: ${{ matrix.qemu_ld_prefix }}
        run: ctest --test-dir c/build -j "$(nproc)" --output-on-failure ${{ matrix.ctest_args }}

  # The oldest supported toolchains, gcc 9 and clang 10 with CMake 3.16, in
  # an Ubuntu 20.04 container: compilers before gcc 11 and clang 12 have no
  # x86-64-v2 and -v3 level names, so the kernel tiers get their instruction
  # sets one by one, and gcc before 10 has no __has_builtin.
  oldest-toolchain:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'portability'
    name: x86-64 / ${{ matrix.cc }} / CMake 3.16
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-9, clang-10]
    steps:
      - name: Install
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${{ matrix.cc }} libc6-dev cmake make
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}
      - name: Build
        run: cmake --build c/build -j "$(nproc)"
      # CMake 3.16's ctest has no --test-dir.
      - name: Test
        working-directory: c/build
        run: ctest -j "$(nproc)" --output-on-failure --timeout 2400 -E mutate

  # Windows x86-64 and i686: cross-compiled with mingw-w64, the tests under
  # Wine (32-bit Wine for i686). Wine is registered as the kernel's handler for
  # Windows executables, so CTest, CMake's script tests and the shell tests run
  # them unchanged. The Wine server is started before CTest: started by a
  # test, its long-lived processes would hold that test's output pipe open
  # until the end of the run. On x86-64 the heaviest decoder and capacity
  # phases run on the AVX2 tier only; i686 has the portable tier alone.
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'windows'
    name: Windows ${{ matrix.arch }} (mingw-w64, tests under Wine) / gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            triple: x86_64
            packages: gcc-mingw-w64-x86-64 wine64 wine
            ctest_exclude: "mutate|(valid|crafted|capacity)_(scalar|sse4)"
          - arch: i686
            triple: i686
            foreign_arch: i386
            packages: gcc-mingw-w64-i686 wine64 wine wine32:i386
            ctest_exclude: "mutate"
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          if [ -n "${{ matrix.foreign_arch }}" ]; then sudo dpkg --add-architecture ${{ matrix.foreign_arch }}; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      # Ubuntu's wine-binfmt package registers nothing on 24.04.
      - name: Register Wine for Windows executables
        run: |
          test -e /proc/sys/fs/binfmt_misc/register || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          echo ':wine:M::MZ::/usr/bin/wine:' | sudo tee /proc/sys/fs/binfmt_misc/register
      - name: Configure
        run: >-
          cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.triple }}
          -DCMAKE_C_COMPILER=${{ matrix.triple }}-w64-mingw32-gcc
      - name: Build
        run: cmake --build c/build -j "$(nproc)"
      - name: Test
        env:
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: -all
        # wineserver does not start without the prefix's directory.
        run: |
          mkdir -p "$WINEPREFIX"
          wineserver -p < /dev/null > /dev/null 2>&1
          wineboot -u < /dev/null > /dev/null 2>&1
          ctest --test-dir c/build -j "$(nproc)" --output-on-failure --timeout 2400 -E '${{ matrix.ctest_exclude }}'
      # The installed files and the DLL name the programs load, in the log.
      - name: Install layout
        run: ctest --test-dir c/build -V -R '^install_layout$'

  # Windows i686 with binutils 2.40 (Debian 12), cross-compiled and not run.
  # The functions are stdcall there, and programs built with bzlib.h link
  # against the import library by their decorated names, which ld from 2.40
  # leaves out of it (the windows job's Ubuntu 24.04 has 2.42, whose ld puts
  # them in). Linking bzip2 and a program that calls every function is the
  # test, with the DLL's exports and that program's imports.
  windows-i686-binutils-2-40:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'windows'
    name: Windows i686 (mingw-w64, binutils 2.40, build only) / gcc
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 30
    steps:
      - name: Install
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64-i686 cmake make
      - uses: actions/checkout@v5
      - name: Configure
        run: >-
          cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=i686
          -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc
      - name: Build
        run: cmake --build c/build -j "$(nproc)"
      - name: Exports and imports
        run: ctest --test-dir c/build -V -R '^abi_(exported_symbols|dll_imports)$'

  # Windows x86-64 with MSVC: the runner image's Visual Studio (2026 on
  # windows-2025 today; CMake picks the newest it finds), Release, built with
  # the Visual Studio generator and tested on Windows itself. What the
  # mingw job cannot see: cl's C11 and its /W4 warnings; the x86 tiers as cl
  # compiles them (the SSE4 tier from intrinsics alone, the AVX2 tier under
  # /arch:AVX2); the DLL that Microsoft's linker makes from the
  # module-definition file, read with dumpbin; Microsoft's own C runtime (the
  # UCRT) under the tests and bzip2; and Windows rather than Wine. The
  # shell-script tests run under Git for Windows' sh. Line endings stay as
  # committed, since the tests compare files byte for byte. A compiler or
  # linker warning fails the job, in a step after the tests so that they
  # still run.
  msvc:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'msvc'
    name: Windows x86-64 / MSVC
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S c -B c/build -A x64
      - name: Build
        run: cmake --build c/build --config Release --parallel "$NUMBER_OF_PROCESSORS" 2>&1 | tee build.log
      - name: Test
        run: ctest --test-dir c/build -C Release -j "$NUMBER_OF_PROCESSORS" --output-on-failure --timeout 2400 -E mutate
      # The tiers this runner has, their common digest, the DLL's exports and
      # the installed files.
      - name: Tiers, exports and install layout
        run: ctest --test-dir c/build -C Release -V -R '^(tier_identity|abi_exported_symbols|install_layout)$'
      # BZ_NO_STDIO under cl: the library must reach no stdio symbol, which
      # the symbol test reads with dumpbin.
      - name: BZ_NO_STDIO build and its symbol test
        run: |
          cmake -S c -B c/build-nostdio -A x64 -DBZ2NG_NO_STDIO=ON
          cmake --build c/build-nostdio --config Release --parallel "$NUMBER_OF_PROCESSORS" 2>&1 | tee -a build.log
          ctest --test-dir c/build-nostdio -C Release -V
      - name: No compiler or linker warnings
        if: ${{ !cancelled() }}
        run: |
          if grep -E 'warning [A-Z]+[0-9]+' build.log; then
            exit 1
          fi

  # The fuzz targets (c/fuzz/), built and run from their generated seeds for
  # 90 s each, 30 s per kernel tier of the runner. Long campaigns run on the
  # reference machines with the same script.
  fuzz:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'fuzz'
    name: fuzz / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      # libFuzzer's runtime is in libclang-rt-18-dev.
      - name: Install clang 18 with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
      - name: Fuzz
        run: |
          status=0
          for t in decompress compress sort; do
            c/fuzz/campaign.sh -l none -o "$RUNNER_TEMP/fuzz" -j "$(nproc)" -s 30 "$t" 90 || status=1
          done
          exit $status
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.arch }}
          path: ${{ runner.temp }}/fuzz/artifacts
